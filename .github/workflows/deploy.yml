# Публикует сайт на GitHub Pages.
# В корне — последняя версия из main, в /v/vX.Y.Z/ — каждая выпущенная версия,
# чтобы любую из них можно было открыть и вернуться к ней.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Собрать сайт со всеми версиями
        run: |
          set -e
          git fetch --tags --force
          mkdir -p _site/v
          git archive origin/main | tar -x -C _site
          rm -rf _site/.github _site/scripts
          tags=$(git tag -l 'v*' --sort=version:refname)
          for t in $tags; do
            mkdir -p "_site/v/$t"
            git archive "$t" | tar -x -C "_site/v/$t"
            rm -rf "_site/v/$t/.github" "_site/v/$t/scripts"
          done
          printf '%s\n' $tags | jq -R . | jq -s 'map(select(length>0))' > _site/versions.json
          touch _site/.nojekyll
          cat _site/versions.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
